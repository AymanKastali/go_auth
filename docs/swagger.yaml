definitions:
  go_auth_internal_adapters_http_fiber_dto.ErrorResponse:
    properties:
      details:
        additionalProperties: {}
        type: object
      message:
        example: humanized error message
        type: string
      trace_id:
        example: req-12345
        type: string
      type:
        example: VALIDATION
        type: string
    type: object
  go_auth_internal_adapters_http_fiber_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  go_auth_internal_adapters_http_fiber_dto.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  go_auth_internal_adapters_http_fiber_dto.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  go_auth_internal_adapters_http_fiber_dto.ManageRoleRequest:
    properties:
      action:
        enum:
        - grant
        - revoke
        type: string
      role:
        type: string
      user_id:
        type: string
    required:
    - action
    - role
    - user_id
    type: object
  go_auth_internal_adapters_http_fiber_dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  go_auth_internal_adapters_http_fiber_dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  go_auth_internal_adapters_http_fiber_dto.RegisteredUserResponse:
    properties:
      email:
        type: string
      user_id:
        type: string
    type: object
  go_auth_internal_adapters_http_fiber_dto.SuccessResponse:
    properties:
      data: {}
      message:
        example: humanized success message
        type: string
    type: object
  go_auth_internal_adapters_http_fiber_dto.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      status:
        type: string
      updated_at:
        type: string
    type: object
info:
  contact: {}
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns access/refresh tokens. Uses device
        metadata for session management.
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully authenticated
          schema:
            allOf:
            - $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.LoginResponse'
              type: object
        "400":
          description: Bad Request - Invalid syntax
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "401":
          description: Unauthorized - Invalid credentials
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "422":
          description: Unprocessable Entity - Validation failed
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
      summary: User Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the provided session renewal token (refresh token).
      parameters:
      - description: Logout Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Successfully logged out
        "400":
          description: Invalid request body or validation failed
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "401":
          description: Unauthorized - Invalid or expired token
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
      summary: User Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Rotates the session renewal token (refresh token) and issues a
        new access token.
      parameters:
      - description: Refresh Token Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens rotated successfully
          schema:
            allOf:
            - $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.LoginResponse'
              type: object
        "400":
          description: Bad Request - Invalid syntax or missing fields
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "401":
          description: Unauthorized - Invalid or expired refresh token
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "403":
          description: Forbidden - Device mismatch or security violation
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
      summary: Refresh Tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account with email and password.
      parameters:
      - description: Registration Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User successfully registered
          schema:
            allOf:
            - $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.RegisteredUserResponse'
              type: object
        "400":
          description: Bad Request - Invalid syntax or missing fields
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "409":
          description: Conflict - Email already exists
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "422":
          description: Unprocessable Entity - Validation failed
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
      summary: Register User
      tags:
      - auth
  /roles/manage:
    post:
      consumes:
      - application/json
      parameters:
      - description: Role management details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ManageRoleRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
      summary: Manage User Roles
      tags:
      - roles
  /user/me:
    get:
      description: Retrieves detailed profile information for the user currently logged
        in.
      produces:
      - application/json
      responses:
        "200":
          description: Profile retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.UserResponse'
              type: object
        "401":
          description: Unauthorized - Session missing or invalid
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/go_auth_internal_adapters_http_fiber_dto.ErrorResponse'
      summary: Get Current User
      tags:
      - user
swagger: "2.0"
