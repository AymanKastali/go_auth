services:
  postgres:
    image: postgres:18
    container_name: "${GA_APP_NAME}_postgres"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - goauth

  web:
    container_name: "${GA_APP_NAME}_app"
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    command: sleep infinity
    env_file:
      - .env
    environment:
      GA_EMAIL_HOST: mailhog
      GA_EMAIL_PORT: 1025
    ports:
      - "${GA_HTTP_PORT:-8080}:${GA_HTTP_PORT:-8080}"
      - "2345:2345"
    user: "1000:1000"
    volumes:
      - ../:/app:cached
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/home/vscode/.cache
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      - goauth

  mailhog:
    image: mailhog/mailhog:latest
    container_name: "${GA_APP_NAME}_mailhog"
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - goauth

networks:
  goauth:
    driver: bridge

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
