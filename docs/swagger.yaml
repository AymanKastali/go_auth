basePath: /
definitions:
  internal_adapters_inbound_fiberapp.ActivationPolicyHTTPResponse:
    properties:
      require_email:
        example: false
        type: boolean
    type: object
  internal_adapters_inbound_fiberapp.AdminUserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      registered_at:
        type: string
      roles:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  internal_adapters_inbound_fiberapp.AssignPermissionRequest:
    properties:
      permission:
        type: string
    required:
    - permission
    type: object
  internal_adapters_inbound_fiberapp.AssignUserRoleRequest:
    properties:
      role_name:
        type: string
    required:
    - role_name
    type: object
  internal_adapters_inbound_fiberapp.ChangePasswordRequest:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  internal_adapters_inbound_fiberapp.ConfirmActivationRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  internal_adapters_inbound_fiberapp.CreateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    required:
    - name
    type: object
  internal_adapters_inbound_fiberapp.DataResponse:
    properties:
      data: {}
    type: object
  internal_adapters_inbound_fiberapp.ErrorBody:
    properties:
      code:
        example: PASSWORD_TOO_SHORT
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        example: password length is below the minimum requirement
        type: string
      trace_id:
        example: req-abc123
        type: string
    type: object
  internal_adapters_inbound_fiberapp.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorBody'
    type: object
  internal_adapters_inbound_fiberapp.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_adapters_inbound_fiberapp.HealthResponse:
    properties:
      status:
        example: healthy
        type: string
    type: object
  internal_adapters_inbound_fiberapp.ListUsersHTTPResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.AdminUserResponse'
        type: array
    type: object
  internal_adapters_inbound_fiberapp.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_adapters_inbound_fiberapp.LoginResponse:
    properties:
      access_exp:
        type: string
      access_token:
        type: string
      refresh_exp:
        type: string
      refresh_token:
        type: string
    type: object
  internal_adapters_inbound_fiberapp.MessageResponse:
    properties:
      message:
        example: operation completed
        type: string
    type: object
  internal_adapters_inbound_fiberapp.PasswordPolicyHTTPResponse:
    properties:
      max_length:
        example: 64
        type: integer
      min_length:
        example: 8
        type: integer
      require_number:
        example: true
        type: boolean
      require_special:
        example: true
        type: boolean
      require_upper:
        example: true
        type: boolean
    type: object
  internal_adapters_inbound_fiberapp.PolicyHTTPResponse:
    properties:
      activation:
        $ref: '#/definitions/internal_adapters_inbound_fiberapp.ActivationPolicyHTTPResponse'
      password:
        $ref: '#/definitions/internal_adapters_inbound_fiberapp.PasswordPolicyHTTPResponse'
      registration:
        $ref: '#/definitions/internal_adapters_inbound_fiberapp.RegisterPolicyHTTPResponse'
    type: object
  internal_adapters_inbound_fiberapp.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_adapters_inbound_fiberapp.RegisterPolicyHTTPResponse:
    properties:
      allow_public:
        example: true
        type: boolean
      blocked_domains:
        items:
          type: string
        type: array
    type: object
  internal_adapters_inbound_fiberapp.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_adapters_inbound_fiberapp.RegisterUserResponse:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  internal_adapters_inbound_fiberapp.ResendActivationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_adapters_inbound_fiberapp.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  internal_adapters_inbound_fiberapp.RevokePermissionRequest:
    properties:
      permission:
        type: string
    required:
    - permission
    type: object
  internal_adapters_inbound_fiberapp.RevokeUserRoleRequest:
    properties:
      role_name:
        type: string
    required:
    - role_name
    type: object
  internal_adapters_inbound_fiberapp.RoleHTTPResponse:
    properties:
      description:
        type: string
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  internal_adapters_inbound_fiberapp.UpdateMeRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_adapters_inbound_fiberapp.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      registered_at:
        type: string
      updated_at:
        type: string
    type: object
  internal_adapters_inbound_fiberapp.ValidateTokenRequest:
    properties:
      access_token:
        type: string
    required:
    - access_token
    type: object
  internal_adapters_inbound_fiberapp.ValidateTokenResponse:
    properties:
      permissions:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      session_id:
        type: string
      user_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: Authentication service using Hexagonal Architecture and Fiber v3.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Auth Service API
  version: "1.0"
paths:
  /api/v1/admin/roles:
    get:
      description: Returns all roles with their permissions
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_adapters_inbound_fiberapp.RoleHTTPResponse'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: List all roles
      tags:
      - Admin - Roles
    post:
      consumes:
      - application/json
      description: Creates a role with optional permissions
      parameters:
      - description: Role Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.RoleHTTPResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Create a new role
      tags:
      - Admin - Roles
  /api/v1/admin/roles/{id}:
    get:
      description: Returns a single role with its permissions
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.RoleHTTPResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Get role by ID
      tags:
      - Admin - Roles
  /api/v1/admin/roles/{id}/permissions:
    delete:
      consumes:
      - application/json
      description: Removes a permission from an existing role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Permission
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.RevokePermissionRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Revoke permission from role
      tags:
      - Admin - Roles
    post:
      consumes:
      - application/json
      description: Adds a permission to an existing role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Permission
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.AssignPermissionRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Assign permission to role
      tags:
      - Admin - Roles
  /api/v1/admin/seed/roles:
    post:
      description: Seeds roles from the YAML configuration file
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Seed roles
      tags:
      - Admin - Seed
  /api/v1/admin/users:
    get:
      description: Returns a paginated list of users
      parameters:
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.ListUsersHTTPResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: List users (paginated)
      tags:
      - Admin - Users
  /api/v1/admin/users/{id}:
    delete:
      description: Admin soft-deletes a user and revokes all sessions
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Delete user (soft)
      tags:
      - Admin - Users
    get:
      description: Returns full user details including roles and status
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.AdminUserResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Get user by ID (admin)
      tags:
      - Admin - Users
  /api/v1/admin/users/{id}/activate:
    post:
      description: Admin activates a user account
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Activate user
      tags:
      - Admin - Users
  /api/v1/admin/users/{id}/deactivate:
    post:
      description: Admin deactivates a user account
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Deactivate user
      tags:
      - Admin - Users
  /api/v1/admin/users/{id}/roles:
    delete:
      consumes:
      - application/json
      description: Removes a role from the specified user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.RevokeUserRoleRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Revoke role from user
      tags:
      - Admin - Users
    post:
      consumes:
      - application/json
      description: Assigns a role to the specified user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Role
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.AssignUserRoleRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Assign role to user
      tags:
      - Admin - Users
  /api/v1/auth/activate:
    post:
      consumes:
      - application/json
      description: Activate a user account using the activation token
      parameters:
      - description: Activation Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.ConfirmActivationRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      summary: Confirm account activation
      tags:
      - Auth
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Request a password reset link by email
      parameters:
      - description: Email Address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      summary: Forgot password
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return tokens
      parameters:
      - description: Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      summary: User Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Revoke the current session
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      security:
      - AccessToken: []
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access token
      parameters:
      - description: Refresh Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.LoginResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      summary: Refresh Access Token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a user account with email and password
      parameters:
      - description: Registration Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.RegisterUserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /api/v1/auth/resend-activation:
    post:
      consumes:
      - application/json
      description: Resend the activation email to the user
      parameters:
      - description: Email Address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.ResendActivationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      summary: Resend activation email
      tags:
      - Auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset the user's password using a valid reset token
      parameters:
      - description: Reset Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      summary: Reset password
      tags:
      - Auth
  /api/v1/auth/validate:
    post:
      consumes:
      - application/json
      description: Validates an access token and returns the associated user info
        (service-to-service)
      parameters:
      - description: Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_inbound_fiberapp.ValidateTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.ValidateTokenResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      summary: Validate access token
      tags:
      - Auth
  /api/v1/policies:
    get:
      description: Returns password and registration policy rules (unauthenticated)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.PolicyHTTPResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
      summary: Get public policies
      tags:
      - Policies
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Search for a specific user using their email address
      parameters:
      - description: User Email
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_adapters_inbound_fiberapp.DataResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_adapters_inbound_fiberapp.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_adapters_inbound_fiberapp.ErrorResponse'
