services:
  web:
    container_name: "${GA_PROJECT_NAME}_app"
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.debug
    tty: true           # Add this: keeps the container alive
    stdin_open: true    # Add this: allows interactive sessions
    env_file:
      - .env
    ports:
      - "${GA_PORT}:${GA_PORT}"
      - "${GA_DEBUGGER_PORT}:${GA_DEBUGGER_PORT}"
    volumes:
      - ..:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined 

  postgres:
    image: postgres:18
    container_name: "${GA_PROJECT_NAME}_postgres"
    restart: always
    volumes:
      - postgres_db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${GA_POSTGRES_PASSWORD}
      POSTGRES_USER: ${GA_POSTGRES_USER}
      POSTGRES_DB: ${GA_POSTGRES_DB}
      POSTGRES_PORT: ${GA_POSTGRES_PORT}
    ports: 
      - "5433:${GA_POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GA_POSTGRES_USER} -d ${GA_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_db: