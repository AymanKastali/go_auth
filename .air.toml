root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -gcflags='all=-N -l' -o ./tmp/main ./cmd/auth/"
  full_bin = "dlv exec ./tmp/main --headless --listen=:2345 --api-version=2 --accept-multiclient --continue"
  include_ext = ["go", "yml", "yaml"]
  exclude_dir = ["tmp", "docs", "diagrams", "vendor", ".devcontainer", ".vscode", ".git"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

[log]
  time = false

[misc]
  clean_on_exit = true
