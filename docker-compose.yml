services:
  postgres:
    image: postgres:18
    container_name: "${GA_APP_NAME}_postgres"
    restart: always
    volumes:
      - postgres_db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: auth_db
      POSTGRES_PORT: 5432
      GA_DATABASE_URL: ${GA_DATABASE_URL}
    ports: 
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_db:
